name: Deploy Trigger to Azure Functions

on:
  push:
    branches: [main]
    paths: ['packages/trigger/**', '.github/workflows/trigger-deploy.yml']
  workflow_dispatch:

env:
  PACKAGE_PATH: "packages/trigger"
  NODE_VERSION: "22.x"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Build and Package
        shell: bash
        run: |
          pnpm install
          pnpm --filter esmos-monitor-trigger build
          
          # Prepare release directory
          cd packages/trigger
          zip -r ../../release.zip . -x "*.git*" "*.github*" "src/*" "tsconfig.json" ".gitignore" ".vscode/*" "local.settings.json" "test/*" 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trigger-package
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: trigger-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Azure Functions Action
        uses: Azure/functions-action@v1
        with:
          app-name: "esmos-monitor-trigger"
          slot-name: "Production"
          package: release.zip
